#studio-design .sd-form-bottom small{font-size:11px;color:#7c8d6e}
#studio-design .sd-contact .sd-form-status{font-size:11px;margin:0;color:#c6dea9}
#studio-design .sd-footer{display:flex;justify-content:space-between;align-items:center;gap:20px;flex-wrap:wrap;padding-top:17px;padding-bottom:35px;font-size:11px;color:#7c8e6c}
#studio-design .sd-footer .sd-brand{font-size:14px;color:#aebfa0}
#studio-design .sd-footer .sd-brand svg{width:19px;height:19px}
#studio-design [dir=ltr]{direction:ltr}
#studio-design[dir=rtl]{font-family:&#x27;IBM Plex Sans Arabic&#x27;,Arial,sans-serif}
#studio-design[dir=rtl] h1,#studio-design[dir=rtl] h2{letter-spacing:0}
#studio-design[dir=rtl] .sd-hero h1 em{font-family:inherit;letter-spacing:0;font-style:normal}
#studio-design[dir=rtl] .sd-art{right:auto;left:-11%;transform:scaleX(-1)}
#studio-design[dir=rtl] .sd-top:before{transform:scaleX(-1)}
#studio-design[dir=rtl] .sd-hero-caption{right:auto;left:8%}
@container(max-width:740px){
 #studio-design .sd-nav{gap:16px}
 #studio-design .sd-grid,#studio-design .sd-grid.sd-reverse{gap:38px}
 #studio-design .sd-service{padding-block:65px}
 #studio-design .sd-wrap{padding-inline:6%}
 #studio-design .sd-hero{padding-top:90px}
 #studio-design .sd-hero-copy{max-width:350px}
 #studio-design .sd-glass{padding:18px}
 #studio-design .sd-software{padding:0}
 #studio-design .sd-appbody{grid-template-columns:39px 1fr}
 #studio-design .sd-apprail{padding-inline:11px}
 #studio-design .sd-appmain{padding-inline:13px}
 #studio-design .sd-contact{gap:30px}
}
@container(max-width:590px){
 #studio-design .sd-header{margin-inline:5%;flex-wrap:wrap;border-radius:19px;padding:12px 15px;gap:6px;min-height:66px}
 #studio-design .sd-nav{order:3;justify-content:center;width:100%;padding-top:8px;margin-top:5px;border-top:1px solid #ffffff0a;gap:35px}
 #studio-design .sd-header .sd-button{padding:8px 12px}
 #studio-design .sd-hero{padding-top:65px;padding-bottom:290px;min-height:690px;display:block}
 #studio-design .sd-hero-copy{max-width:380px}
 #studio-design .sd-hero-copy&gt;p{max-width:33ch}
 #studio-design .sd-art{height:365px;top:auto;bottom:0;right:-9%;width:119%;opacity:.85;mask-image:linear-gradient(0deg,transparent 0%,#000 18%,#000 70%,transparent 100%)}
 #studio-design .sd-top:before{background:linear-gradient(0deg,#080b09 0%,transparent 30%,transparent 45%,#080b09 57%)}
 #studio-design .sd-hero-caption{bottom:35px;right:6%;padding:12px 16px}
 #studio-design .sd-index{gap:12px 19px;padding-block:23px}
 #studio-design .sd-index a{font-size:11px}
 #studio-design .sd-grid,#studio-design .sd-grid.sd-reverse,#studio-design .sd-wide-intro,#studio-design .sd-about,#studio-design .sd-contact{grid-template-columns:1fr;gap:32px}
 #studio-design .sd-copy{max-width:420px}
 #studio-design .sd-copy p{font-size:14px;max-width:40ch}
 #studio-design .sd-copy .sd-examples{font-size:12px;max-width:42ch}
 #studio-design .sd-grid.sd-reverse&gt;.sd-copy{grid-row:1}
 #studio-design .sd-glass{max-width:420px;width:100%;justify-self:center;padding:22px}
 #studio-design .sd-software{padding:0;transform:rotate(-1deg);width:97%}
 #studio-design .sd-node strong{font-size:12px}
 #studio-design .sd-node small{font-size:11px}
 #studio-design .sd-node-icon{width:35px;height:35px}
 #studio-design .sd-tabs button{font-size:11px;min-height:38px}
 #studio-design .sd-device-stage{max-width:390px;width:100%;justify-self:center}
 #studio-design .sd-wide-intro{gap:20px;margin-bottom:30px}
 #studio-design .sd-wide-intro .sd-copy p{margin-top:0}
 #studio-design .sd-research{display:block;max-width:none}
 #studio-design .sd-research-steps{flex-direction:row;gap:2px;margin-bottom:20px}
 #studio-design .sd-research-steps button{flex:1;padding:11px 6px;font-size:11px;justify-content:center;gap:6px;min-width:0}
 #studio-design .sd-research-steps b{display:none}
 #studio-design .sd-document{min-height:213px}
 #studio-design .sd-method-intro{display:block}
 #studio-design .sd-method-intro p{margin-top:16px;max-width:30ch}
 #studio-design .sd-method-grid{grid-template-columns:1fr 1fr;row-gap:30px}
 #studio-design .sd-about{padding-block:60px;gap:24px}
 #studio-design .sd-contact{margin-inline:4%;padding:35px 7%;border-radius:22px;gap:32px}
 #studio-design .sd-contact h2{font-size:28px}
 #studio-design .sd-fields{grid-template-columns:1fr}
 #studio-design .sd-field input,#studio-design .sd-field textarea{font-size:16px}
 #studio-design .sd-form-bottom small{font-size:11px}
 #studio-design .sd-footer{font-size:11px}
 #studio-design[dir=rtl] .sd-art{left:-9%}
 #studio-design[dir=rtl] .sd-hero-caption{left:6%}
}
@media(prefers-reduced-motion:reduce){#studio-design *{transition:none!important;scroll-behavior:auto!important}}
